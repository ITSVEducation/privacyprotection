[project]
name = "privacyprotection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "ginza>=5.2",
    "ja_ginza>=5.2",
    # spacy>=3.8 breaks ginza's compound_splitter factory: confection now
    # strictly rejects its default_config split_mode=None against the
    # `split_mode: str` type hint. Pin below the break until ginza publishes
    # a fix (ginza itself only declares spacy>=3.4.4,<4.0.0).
    "spacy>=3.4.4,<3.8.0",
    "click>=8.1",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
